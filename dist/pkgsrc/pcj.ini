; Predator: Concrete Jungle (PC test build) settings. Lines are KEY=VALUE.
; Values set in run.bat or the environment win over this file.

; Folder that contains default.xbe and the rest of the Xbox disc files.
; Windows example:
; game=<folder with default.xbe>  (pcj.exe asks on first run if this is empty)
; macOS + Whisky example (Z: is the Mac's root folder "/"):
;game=Z:\Users\you\Games\Predator Concrete Jungle

; Saves (emulated Xbox hard disk). Default: the "save" folder next to pcj.exe.
;save=C:\Games\PCJ\save

; Window size = 640x480 times this (1 to 4). F11 toggles fullscreen.
CJ_WINDOW_SCALE=2
; 1 = start fullscreen
CJ_FULLSCREEN=1
; 1 = vsync on (caps the frame rate at the display's)
CJ_VSYNC=0
; OpenGL renderer (1). 0 = the toolkit's software renderer (very slow, for comparison only)
CJ_GL=1
; 1 = vertex programs on the GPU (default), 0 = on the CPU
CJ_GL_VSH=1
; 0 = skip XAudio2 and use waveOut for sound
;CJ_AUDIO_XA2=0

; Sound: the game's own mixer plays natively (default). 0 = through the emulated Xbox audio chip as before
;CJ_DSOUND=0
; Mods: files in the "mods" folder next to pcj.exe replace game files with the same path
; (mods\Predator\Binary\_bin_xb\...). Another folder: CJ_MODS_DIR=<folder>; 0 = ignore it
;CJ_MODS_DIR=0
